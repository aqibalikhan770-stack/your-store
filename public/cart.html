<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Cart | Your Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="announcement" id="announcement"></div>

  <header class="site-header">
    <div class="container header-inner">
      <div id="site-logo"></div>
      <nav class="nav nav-main" id="site-nav"></nav>
      <div class="header-actions">
        <div class="search-wrap">
          <span class="search-icon">&#128269;</span>
          <input type="text" class="search-input" id="search-input" placeholder="Search products...">
          <div class="search-results" id="search-results"></div>
        </div>
        <a href="/cart.html" class="icon-btn" title="Cart">&#128722;<span class="cart-count" id="cart-count" style="display:none">0</span></a>
      </div>
    </div>
  </header>

  <div class="page-head"><h1>Your Cart</h1></div>

  <div class="container cart-wrap" id="cart-root"></div>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/store.js"></script>`n  <script src="/static-data.js"></script>
  <script>
    function renderCartPage() {
      const root = document.getElementById('cart-root');
      const cart = Store.getCart();
      if (!cart.length) {
        root.innerHTML = `
          <div class="cart-empty">
            <div class="big">&#128722;</div>
            <h2 style="margin-bottom:10px">Your cart is empty</h2>
            <p style="color:var(--muted);margin-bottom:22px">Looks like you haven't added anything yet.</p>
            <a href="/collection.html?cat=all" class="btn">Continue shopping</a>
          </div>`;
        return;
      }

      const lines = cart.map((i) => {
        const p = Store.getProduct(i.id);
        if (!p) return '';
        const subtotal = p.price * i.qty;
        return `
          <div class="cart-item">
            <a href="/product.html?id=${p.id}"><img src="${p.images[0]}" onerror="this.src='https://placehold.co/200x200/e8e3d8/6b6b6b?text='"></a>
            <div>
              <div class="ci-name">${p.name}</div>
              <div class="ci-price">${Store.formatPrice(p.price)}</div>
              <div class="qty-control" style="margin-top:8px;width:max-content">
                <button onclick="Store.updateQty('${p.id}', ${i.qty - 1})">-</button>
                <input value="${i.qty}" readonly>
                <button onclick="Store.updateQty('${p.id}', ${i.qty + 1})">+</button>
              </div>
            </div>
            <div class="ci-actions">
              <span class="ci-total">${Store.formatPrice(subtotal)}</span>
              <button class="ci-remove" onclick="Store.removeFromCart('${p.id}')">Remove</button>
            </div>
          </div>`;
      }).join('');

      const subtotal = Store.cartSubtotal();
      const shipping = 199;
      const total = subtotal + shipping;

      root.innerHTML = `
        <div class="cart-layout">
          <div>
            <div class="cart-items">${lines}</div>
          </div>
          <aside class="cart-summary">
            <h3>Order Summary</h3>
            <div class="sum-row"><span>Subtotal</span><span>${Store.formatPrice(subtotal)}</span></div>
            <div class="sum-row"><span>Shipping</span><span>${Store.formatPrice(shipping)}</span></div>
            <div class="sum-row"><span>Tax</span><span class="note">Calculated at checkout</span></div>
            <div class="sum-row total"><span>Total</span><span>${Store.formatPrice(total)}</span></div>
            <a href="/checkout.html" class="btn btn-gold btn-block" style="margin-top:18px">Check out</a>
            <div class="secure-note" style="margin-top:10px">&#128274; Cash on Delivery available</div>
            <a href="/collection.html?cat=all" style="display:block;text-align:center;margin-top:12px;font-size:.83rem;color:var(--muted)">Continue shopping</a>
          </aside>
        </div>`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const check = setInterval(() => {
        if (!Store.products.length) return;
        clearInterval(check);
        Store.renderCartPage = renderCartPage;
        renderCartPage();
      }, 50);
    });
  </script>
</body>
</html>
