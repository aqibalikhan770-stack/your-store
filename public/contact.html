<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | Your Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="announcement" id="announcement"></div>

  <header class="site-header">
    <div class="container header-inner">
      <div id="site-logo"></div>
      <nav class="nav nav-main" id="site-nav"></nav>
      <div class="header-actions">
        <div class="search-wrap">
          <span class="search-icon">&#128269;</span>
          <input type="text" class="search-input" id="search-input" placeholder="Search products...">
          <div class="search-results" id="search-results"></div>
        </div>
        <a href="/cart.html" class="icon-btn" title="Cart">&#128722;<span class="cart-count" id="cart-count" style="display:none">0</span></a>
      </div>
    </div>
  </header>

  <div class="page-head">
    <div class="crumbs"><a href="/">Home</a> / Contact</div>
    <h1>Contact Us</h1>
  </div>

  <div class="container">
    <div class="contact-grid">
      <div>
        <h2 style="margin-bottom:16px">Get in touch</h2>
        <p style="color:var(--muted);margin-bottom:24px">Have a question about an order or a product? Message us on WhatsApp or through the form and we'll get back to you as soon as possible.</p>
        <ul class="contact-info" id="contact-info"></ul>
        <div style="margin-top:20px;display:flex;gap:12px" id="contact-social">
          <a href="#" class="btn btn-outline">Facebook</a>
          <a href="#" class="btn btn-outline">Instagram</a>
          <a href="#" class="btn btn-outline">TikTok</a>
        </div>
      </div>
      <form class="checkout-form" onsubmit="sendContact(event)">
        <div class="form-row">
          <div class="form-group"><label>Name *</label><input type="text" id="ct-name" required placeholder="Your name"></div>
          <div class="form-group"><label>Phone / Email *</label><input type="text" id="ct-contact" required placeholder="How can we reach you?"></div>
        </div>
        <div class="form-group"><label>Subject</label><input type="text" id="ct-subject" placeholder="Order issue, product question..."></div>
        <div class="form-group"><label>Message *</label><textarea id="ct-message" rows="5" required placeholder="Write your message..."></textarea></div>
        <button type="submit" class="btn btn-gold">Send Message</button>
      </form>
    </div>
  </div>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/store.js"></script>
  <script>
    function renderContact() {
      const c = Store.config.contact || {};
      document.getElementById('contact-info').innerHTML = `
        <li><span class="ci-icon">&#128222;</span> <span><strong>WhatsApp / Call</strong><br>${c.phone || ''}</span></li>
        <li><span class="ci-icon">&#128231;</span> <span><strong>Email</strong><br>${c.email || ''}</span></li>
        <li><span class="ci-icon">&#128205;</span> <span><strong>Location</strong><br>${c.address || ''}</span></li>
        <li><span class="ci-icon">&#128337;</span> <span><strong>Hours</strong><br>Mon&ndash;Sat, 10am &ndash; 8pm</span></li>`;
      const s = Store.config.social || {};
      const links = [
        s.facebook ? `<a href="${s.facebook}" target="_blank" class="btn btn-outline">Facebook</a>` : '',
        s.instagram ? `<a href="${s.instagram}" target="_blank" class="btn btn-outline">Instagram</a>` : '',
        s.tiktok ? `<a href="${s.tiktok}" target="_blank" class="btn btn-outline">TikTok</a>` : ''
      ].join('');
      document.getElementById('contact-social').innerHTML = links || '<a href="#" class="btn btn-outline">Facebook</a>';
    }

    function sendContact(e) {
      e.preventDefault();
      Store.toast('Thank you! We will get back to you soon.');
      document.getElementById('ct-name').value = '';
      document.getElementById('ct-contact').value = '';
      document.getElementById('ct-subject').value = '';
      document.getElementById('ct-message').value = '';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const check = setInterval(() => {
        if (!Store.products.length) return;
        clearInterval(check);
        renderContact();
      }, 50);
    });
  </script>
</body>
</html>
