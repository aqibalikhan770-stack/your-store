<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout | Your Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="announcement" id="announcement"></div>

  <header class="site-header">
    <div class="container header-inner">
      <div id="site-logo"></div>
      <nav class="nav nav-main" id="site-nav"></nav>
      <div class="header-actions">
        <div class="search-wrap">
          <span class="search-icon">&#128269;</span>
          <input type="text" class="search-input" id="search-input" placeholder="Search products...">
          <div class="search-results" id="search-results"></div>
        </div>
        <a href="/cart.html" class="icon-btn" title="Cart">&#128722;<span class="cart-count" id="cart-count" style="display:none">0</span></a>
      </div>
    </div>
  </header>

  <div class="page-head"><h1>Checkout</h1></div>

  <div class="container cart-wrap" id="checkout-root"></div>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="/js/store.js"></script>
  <script>
    function renderCheckout() {
      const root = document.getElementById('checkout-root');
      const cart = Store.getCart();
      if (!cart.length) {
        root.innerHTML = `
          <div class="cart-empty">
            <div class="big">&#128722;</div>
            <h2 style="margin-bottom:10px">Your cart is empty</h2>
            <p style="color:var(--muted);margin-bottom:22px">Add some products before checking out.</p>
            <a href="/collection.html?cat=all" class="btn">Continue shopping</a>
          </div>`;
        return;
      }

      const lines = cart.map((i) => {
        const p = Store.getProduct(i.id);
        if (!p) return '';
        return `<div class="sum-row"><span>${p.name} &times; ${i.qty}</span><span>${Store.formatPrice(p.price * i.qty)}</span></div>`;
      }).join('');

      const subtotal = Store.cartSubtotal();
      const shipping = 199;
      const total = subtotal + shipping;

      root.innerHTML = `
        <div class="cart-layout">
          <form class="checkout-form" id="checkout-form" onsubmit="placeOrder(event)">
            <div class="form-group">
              <label>Full Name *</label>
              <input type="text" id="co-name" required placeholder="e.g. Ahmed Khan">
            </div>
            <div class="form-group">
              <label>Phone Number *</label>
              <input type="tel" id="co-phone" required placeholder="03XX-XXXXXXX">
              <div class="hint">We will call to confirm your order.</div>
            </div>
            <div class="form-group">
              <label>Email (optional)</label>
              <input type="email" id="co-email" placeholder="you@example.com">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>City *</label>
                <input type="text" id="co-city" required placeholder="e.g. Lahore">
              </div>
              <div class="form-group">
                <label>Province *</label>
                <select id="co-province" required>
                  <option value="">Select province</option>
                  <option>Punjab</option>
                  <option>Sindh</option>
                  <option>Khyber Pakhtunkhwa</option>
                  <option>Balochistan</option>
                  <option>Islamabad Capital Territory</option>
                  <option>Azad Kashmir</option>
                  <option>Gilgit-Baltistan</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Complete Address *</label>
              <textarea id="co-address" rows="3" required placeholder="House no, street, area..."></textarea>
            </div>
            <div class="form-group">
              <label>Payment Method</label>
              <div class="payment-options">
                <label class="payment-option selected" onclick="selectPayment(this)">
                  <input type="radio" name="payment" value="cod" checked>
                  <span>&#128176;</span>
                  <div><div style="font-weight:600">Cash on Delivery</div><div class="hint">Pay in cash when your order arrives</div></div>
                </label>
                <label class="payment-option" onclick="selectPayment(this)">
                  <input type="radio" name="payment" value="bank">
                  <span>&#127974;</span>
                  <div><div style="font-weight:600">Bank Transfer</div><div class="hint">Pay via bank transfer (details shared on confirmation)</div></div>
                </label>
              </div>
            </div>
            <button type="submit" class="btn btn-gold btn-block" style="margin-top:6px">Place Order &mdash; ${Store.formatPrice(total)}</button>
            <div class="secure-note">&#128274; Your order will be confirmed by phone.</div>
          </form>

          <aside class="cart-summary">
            <h3>Order Summary</h3>
            ${lines}
            <div class="sum-row" style="border-top:1px solid var(--line);margin-top:8px"><span>Shipping</span><span>${Store.formatPrice(shipping)}</span></div>
            <div class="sum-row total"><span>Total</span><span>${Store.formatPrice(total)}</span></div>
          </aside>
        </div>`;
    }

    function selectPayment(label) {
      document.querySelectorAll('.payment-option').forEach((o) => o.classList.remove('selected'));
      label.classList.add('selected');
      label.querySelector('input').checked = true;
    }

    async function placeOrder(e) {
      e.preventDefault();
      const cart = Store.getCart();
      const items = cart.map((i) => {
        const p = Store.getProduct(i.id);
        return { id: i.id, name: p.name, qty: i.qty, price: p.price };
      });
      const subtotal = Store.cartSubtotal();
      const shipping = 199;
      const order = {
        customer: {
          name: document.getElementById('co-name').value.trim(),
          phone: document.getElementById('co-phone').value.trim(),
          email: document.getElementById('co-email').value.trim(),
          city: document.getElementById('co-city').value.trim(),
          province: document.getElementById('co-province').value,
          address: document.getElementById('co-address').value.trim()
        },
        payment: document.querySelector('input[name=payment]:checked').value,
        items,
        subtotal,
        shipping,
        total: subtotal + shipping
      };
      const res = await fetch('/api/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(order)
      });
      const data = await res.json();
      if (data.success) {
        localStorage.setItem('store_cart', '[]');
        Store.renderCartCount();
        document.getElementById('checkout-root').innerHTML = `
          <div class="cart-empty">
            <div class="big">&#127881;</div>
            <h2 style="margin-bottom:10px">Order Placed Successfully!</h2>
            <p style="color:var(--muted);margin-bottom:6px">Your order number is <strong>${data.id}</strong>.</p>
            <p style="color:var(--muted);margin-bottom:22px">We will call you soon to confirm your order.</p>
            <a href="/collection.html?cat=all" class="btn">Continue shopping</a>
          </div>`;
      } else {
        Store.toast('Something went wrong. Please try again.');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const check = setInterval(() => {
        if (!Store.products.length) return;
        clearInterval(check);
        renderCheckout();
      }, 50);
    });
  </script>
</body>
</html>
