name: Deploy storefront to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate static data
        run: node -e "const fs=require('fs');const d=JSON.parse(fs.readFileSync('data/products.json','utf8'));fs.writeFileSync('public/static-data.js','window.STATIC_DATA='+JSON.stringify({store:d.store,categories:d.categories,products:d.products,reviews:d.reviews})+';');"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
        id: deployment
